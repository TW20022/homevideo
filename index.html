<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私人影库 V1.0 - 完美版</title>
    <link href="https://lib.baomitu.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://lib.baomitu.com/hls.js/1.4.10/hls.min.js"></script>
    <style>
        body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .main-container { max-width: 850px; margin: 20px auto; padding: 25px; background: #fff; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .movie-item { cursor: pointer; border: none; margin-bottom: 10px; border-radius: 12px !important; transition: all 0.3s ease; background: #fff; border: 1px solid #eee; }
        .movie-item:hover { background: #f0f7ff; transform: translateX(8px); border-color: #0d6efd; box-shadow: 0 4px 12px rgba(13,110,253,0.1); }
        .nav-link { font-size: 0.85rem; padding: 8px 18px; margin: 4px; border: 1px solid #eee !important; border-radius: 30px !important; color: #555; transition: 0.2s; }
        .nav-link.active { background: #0d6efd !important; color: #fff !important; border-color: #0d6efd !important; box-shadow: 0 4px 10px rgba(13,110,253,0.2); }
        #video-player { width: 100%; height: auto; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .play-btns { max-height: 200px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 10px; padding: 15px; background: #f8f9fa; border-radius: 12px; }
        .btn-playing { background-color: #0d6efd !important; color: #fff !important; border-color: #0d6efd !important; transform: scale(1.05); }
        .pager-wrapper { display: flex; justify-content: center; margin-top: 30px; }
        .page-input-group { display: flex; align-items: center; background: #f1f3f5; padding: 6px 18px; border-radius: 12px; gap: 12px; }
        .page-input { width: 55px; border: 1px solid #ced4da; text-align: center; border-radius: 6px; height: 32px; font-weight: bold; outline: none; }
        .debug-box { background: #1a1a1a; color: #4ade80; padding: 12px; border-radius: 10px; font-size: 11px; word-break: break-all; font-family: 'Courier New', Courier, monospace; margin-top: 15px; opacity: 0.8; }
    </style>
</head>
<body>

<div class="container main-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold m-0 text-primary">🎬 私人影库 <span class="badge bg-primary-soft text-primary fs-6 fw-normal">V1.0</span></h4>
        <button class="btn btn-sm btn-outline-danger" onclick="clearAllCache()">清空历史</button>
    </div>

    <div class="input-group mb-4 shadow-sm" style="border-radius: 10px; overflow: hidden;">
        <input type="text" id="wd" class="form-control border-0 px-3" placeholder="搜索资源名称..." onkeydown="if(event.keyCode==13) doSearch()">
        <button class="btn btn-primary px-4" onclick="doSearch()">搜索</button>
    </div>

    <div id="class-nav" class="nav nav-pills justify-content-center mb-4">
        <button class="nav-link active" onclick="filterType(0, this)">最新更新</button>
    </div>

    <ul id="list" class="list-group border-0"></ul>

    <div class="pager-wrapper">
        <div class="page-input-group shadow-sm border">
            <button class="btn btn-sm btn-light" onclick="changePage(-1)">◀</button>
            <div class="d-flex align-items-center">
                <input type="number" id="jump-pg" class="page-input" value="1" onkeydown="if(event.keyCode==13) jumpPage()">
                <span class="ms-2 text-muted small">/ <span id="total-pg">1</span></span>
            </div>
            <button class="btn btn-sm btn-light" onclick="changePage(1)">▶</button>
            <button class="btn btn-sm btn-primary ms-2" style="border-radius:8px" onclick="jumpPage()">跳转</button>
        </div>
    </div>
</div>

<div class="modal fade" id="modal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0">
            <div class="modal-header border-0 shadow-sm">
                <h6 id="m-name" class="fw-bold m-0 text-truncate">载入中...</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="stopPlayer()"></button>
            </div>
            <div class="modal-body p-4">
                <video id="video-player" controls playsinline></video>
                <div class="play-btns mb-3 mt-3 shadow-inner" id="m-links"></div>
                <div class="debug-box" id="debug-url">等待选择集数...</div>
            </div>
        </div>
    </div>
</div>

<script src="https://lib.baomitu.com/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
<script>
    let query = { pg: 1, wd: '', t: 0 };
    let modalObj = null;
    let hlsInstance = null;
    let currentPlayUrl = "";
    let maxPage = 1;
    let isClassLoaded = false; 

    const videoEl = document.getElementById('video-player');

    window.onload = () => {
        modalObj = new bootstrap.Modal(document.getElementById('modal'));
        loadList();
        
        // 自动续播：每 5 秒保存一次进度
        videoEl.ontimeupdate = () => {
            if (currentPlayUrl && videoEl.currentTime > 5) {
                localStorage.setItem('pos_' + btoa(currentPlayUrl), videoEl.currentTime);
            }
        };

        // 自动下一集逻辑
        videoEl.onended = () => {
            const nextBtn = document.querySelector('.btn-playing').nextElementSibling;
            if (nextBtn) nextBtn.click();
        };
    };

    async function apiCall(action, params = {}) {
        let url = `api.php?ac=${action}`;
        for (let key in params) url += `&${key}=${params[key]}`;
        const res = await fetch(url);
        return await res.json();
    }

    async function loadList() {
        const data = await apiCall('list', { pg: query.pg, wd: encodeURIComponent(query.wd), t: query.t });
        
        if (!isClassLoaded && data.class) {
            const nav = document.getElementById('class-nav');
            data.class.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'nav-link';
                btn.innerText = c.type_name;
                btn.onclick = (e) => filterType(c.type_id, e.target);
                nav.appendChild(btn);
            });
            isClassLoaded = true;
        }

        maxPage = data.pagecount || 1;
        document.getElementById('total-pg').innerText = maxPage;
        document.getElementById('jump-pg').value = query.pg;

        const listWrap = document.getElementById('list');
        listWrap.innerHTML = '';
        data.list.forEach(item => {
            const li = document.createElement('li');
            li.className = 'list-group-item movie-item d-flex justify-content-between align-items-center shadow-sm';
            li.innerHTML = `<div><span class="text-dark fw-bold">${item.vod_name}</span> <span class="badge bg-light text-primary border ms-2 small">${item.type_name}</span></div><small class="text-muted">${item.vod_remarks}</small>`;
            li.onclick = () => showDetail(item.vod_id);
            listWrap.appendChild(li);
        });
    }

    async function showDetail(id) {
        modalObj.show();
        stopPlayer();
        const data = await apiCall('detail', { ids: id });
        const v = data.list[0];
        document.getElementById('m-name').innerText = v.vod_name;
        const linkWrap = document.getElementById('m-links');
        linkWrap.innerHTML = '';

        const playlist = v.vod_play_url.split('#');
        playlist.forEach((line, index) => {
            const parts = line.split('$');
            if(parts.length > 1) {
                const btn = document.createElement('button');
                btn.className = 'btn btn-sm btn-outline-primary py-1 btn-epi';
                btn.id = 'epi-' + index;
                btn.innerText = parts[0];
                btn.onclick = () => initPlayer(parts[1].trim(), btn.id);
                linkWrap.appendChild(btn);
            }
        });

        // 默认自动播放第一集
        if (playlist.length > 0) {
            const first = playlist[0].split('$');
            if(first.length > 1) initPlayer(first[1].trim(), 'epi-0');
        }
    }

    function initPlayer(url, btnId) {
        currentPlayUrl = url;
        document.getElementById('debug-url').innerText = "STREAM: " + url;
        document.querySelectorAll('.btn-epi').forEach(b => b.classList.remove('btn-playing'));
        const activeBtn = document.getElementById(btnId);
        if(activeBtn) activeBtn.classList.add('btn-playing');

        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        const startPos = localStorage.getItem('pos_' + btoa(url)) || 0;

        if (Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(videoEl);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                if(startPos > 5) videoEl.currentTime = parseFloat(startPos);
                videoEl.play();
            });
        } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
            videoEl.src = url;
            videoEl.addEventListener('loadedmetadata', () => {
                if(startPos > 5) videoEl.currentTime = parseFloat(startPos);
                videoEl.play();
            });
        }
    }

    function stopPlayer() { 
        if(hlsInstance) { hlsInstance.destroy(); hlsInstance = null; } 
        videoEl.pause();
        videoEl.removeAttribute('src');
        videoEl.load();
    }

    function jumpPage() {
        let p = parseInt(document.getElementById('jump-pg').value);
        if (p >= 1 && p <= maxPage) { query.pg = p; loadList(); window.scrollTo(0,0); }
    }

    function doSearch() { query.wd = document.getElementById('wd').value; query.pg = 1; loadList(); }
    
    function filterType(id, el) { 
        query.t = id; query.pg = 1; 
        document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active')); 
        el.classList.add('active'); 
        loadList(); 
    }

    function changePage(d) { 
        if(query.pg+d >=1 && query.pg+d <= maxPage){ 
            query.pg+=d; loadList(); window.scrollTo(0,0); 
        } 
    }

    function clearAllCache() {
        if(confirm('确定要清空所有播放历史并重置缓存吗？')) {
            localStorage.clear();
            apiCall('clear').then(() => {
                alert('系统已重置');
                location.reload();
            });
        }
    }
</script>
</body>
</html>
